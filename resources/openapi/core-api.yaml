openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: https://api.server.test/v1
paths:
  /game:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: '123e4567-e89b-12d3-a456-426614174000'
                  name:
                    type: string
                    example: 'Dark Hunt'
                  game_master:
                    $ref: '#/components/schemas/Player'
                  characters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Character'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Game not found'
components:
  schemas:
    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'John Doe'
    Character:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'Aragorn'
        player:
          $ref: '#/components/schemas/Player'